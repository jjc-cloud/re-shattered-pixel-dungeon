name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build unsigned IPA
        env:
          ORG_GRADLE_PROJECT_RSPD_STORE_FILE: /tmp/dummy.keystore
          ORG_GRADLE_PROJECT_RSPD_STORE_PASSWORD: dummy
          ORG_GRADLE_PROJECT_RSPD_KEY_ALIAS: dummy
          ORG_GRADLE_PROJECT_RSPD_KEY_PASSWORD: dummy
        run: |
          ./gradlew ios:createIPA \
            -Probovm.iosSkipSigning=true \
            --stacktrace

      - name: Locate IPA
        run: find ios/build -type f -name "*.ipa" -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: re-shattered-ios
          path: ios/build/**/*.ipa
