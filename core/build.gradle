apply plugin: 'java-library'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

dependencies {
    api project(':SPD-classes')
    implementation project(':services')
    testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

//TestStart 的开关由构建决定，省得打包前手改源码、测试时又改回来。
//打包/发布类任务(assembleXxx、createIPA、portableZip、jpackage…)一律关闭，
//本地运行和地形回归任务自动开启；回归编译后直接从 IDE 运行也能沿用测试开局。
//其余情况(含 IDE 同步、无任务名)关闭。
//需要时可以用 -PtestStart=true/false 强制指定。
def testStartLocalRunTasks = ['debug', 'run', 'installdebug',
                             'launchiphonesimulator', 'launchipadsimulator',
                             'launchiosdevice', 'launchiossimulator',
                             'terraininteractionregression']
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.tokenize(':').last().toLowerCase(Locale.ROOT) }
def testStartEnabled = providers.gradleProperty('testStart').map { it.toBoolean() }
        .getOrElse(requestedTaskNames.any { testStartLocalRunTasks.contains(it) })

def testStartConfigDir = layout.buildDirectory.dir('generated/testStart')

//TestStart 读的是 enabled() 这个方法的返回值，而不是常量字段：
//常量会被 javac 内联进调用方，改了值而不重新编译调用方就会拿到旧值。
def generateTestStartConfig = tasks.register('generateTestStartConfig') {
    def outputDir = testStartConfigDir
    def enabled = testStartEnabled
    inputs.property('testStartEnabled', enabled)
    outputs.dir(outputDir)
    doLast {
        logger.lifecycle("TestStart.ENABLED = ${enabled} (requested tasks: ${requestedTaskNames})")
        def generated = outputDir.get().file('com/shatteredpixel/shatteredpixeldungeon/TestStartConfig.java').asFile
        generated.parentFile.mkdirs()
        generated.text =
                "package com.shatteredpixel.shatteredpixeldungeon;\n" +
                "\n" +
                "/** Generated by the gradle task generateTestStartConfig, do not edit. */\n" +
                "public final class TestStartConfig {\n" +
                "\tprivate TestStartConfig(){}\n" +
                "\tpublic static boolean enabled(){\n" +
                "\t\treturn " + enabled + ";\n" +
                "\t}\n" +
                "}\n"
    }
}

sourceSets.main.java.srcDir(testStartConfigDir)
tasks.named('compileJava') { dependsOn generateTestStartConfig }

tasks.register('chestRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.ChestRegression'
}

tasks.register('terrainInteractionRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.TerrainInteractionRegression'
}

tasks.register('superSecretRoomRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.SuperSecretRoomRegression'
}

tasks.register('caveCollapseRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.CaveCollapseRegression'
}

tasks.register('achievementRegression', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    workingDir = projectDir.parentFile
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.AchievementRegression'
}
